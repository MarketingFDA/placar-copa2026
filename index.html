<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copa 2026 — 1ª Dinâmica</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700;900&display=swap');

:root {
  --green:#00A651; --green2:#4DCC85; --green3:#006B34;
  --gold:#FFD700;  --gold2:#D4A017;  --gold3:#8a6000;
  --silver:#C8C8C8; --bronze:#CD7F32;
  --red:#cc0000;
  --bg:#04060e; --dark:#080b18; --card:#0d1120; --card2:#101528;
  --border:rgba(255,255,255,0.06);
  --white:#fff; --gray:#6a7290;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--white);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}

/* ─── BACKGROUND ─── */
#bg{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg-field{
  position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.04;
  background:
    repeating-linear-gradient(0deg,transparent,transparent 58px,rgba(0,166,81,.5) 58px,rgba(0,166,81,.5) 60px),
    repeating-linear-gradient(90deg,transparent,transparent 58px,rgba(0,166,81,.5) 58px,rgba(0,166,81,.5) 60px);
  animation:field-scroll 30s linear infinite;
}
@keyframes field-scroll{to{background-position:0 60px,60px 0}}

.blob{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;animation:blob-drift 16s ease-in-out infinite alternate}
.blob1{width:700px;height:700px;background:radial-gradient(circle,rgba(0,166,81,.08),transparent 70%);top:-200px;left:-200px;animation-duration:18s}
.blob2{width:600px;height:600px;background:radial-gradient(circle,rgba(212,160,23,.06),transparent 70%);bottom:-150px;right:-150px;animation-duration:14s;animation-delay:-7s}
.blob3{width:400px;height:400px;background:radial-gradient(circle,rgba(0,80,200,.05),transparent 70%);top:40%;left:45%;animation-duration:22s;animation-delay:-11s}
@keyframes blob-drift{
  0%  {transform:translate(0,0) scale(1)}
  33% {transform:translate(80px,50px) scale(1.1)}
  66% {transform:translate(-50px,80px) scale(.92)}
  100%{transform:translate(40px,-40px) scale(1.05)}
}

/* ─── TICKER ─── */
.ticker-bar{
  position:sticky;top:0;z-index:100;
  background:linear-gradient(90deg,#000 0%,#061410 50%,#000 100%);
  border-bottom:1px solid rgba(0,166,81,.25);
  overflow:hidden;height:36px;display:flex;align-items:center;
}
.ticker-label{
  flex-shrink:0;background:var(--green);
  color:#000;font-weight:900;font-size:10px;
  letter-spacing:2px;padding:0 16px;height:100%;
  display:flex;align-items:center;text-transform:uppercase;
  white-space:nowrap;
}
.ticker-track{display:flex;gap:0;animation:ticker-scroll 40s linear infinite;white-space:nowrap}
.ticker-item{
  font-size:11px;letter-spacing:1px;padding:0 24px;color:#aaa;
  border-right:1px solid rgba(255,255,255,.08);
}
.ticker-item span{color:var(--gold);font-weight:700}
@keyframes ticker-scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ─── CONTAINER ─── */
.wrap{position:relative;z-index:1;max-width:1300px;margin:0 auto;padding:0 24px 80px}

/* ─── HEADER ─── */
.header{text-align:center;padding:56px 20px 40px;position:relative}
.header::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:90%;max-width:800px;height:2px;
  background:linear-gradient(90deg,transparent,var(--green),var(--gold),var(--green),transparent);
  box-shadow:0 0 30px rgba(0,166,81,.5);
}
.live-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#700,var(--red));
  color:#fff;font-size:11px;font-weight:800;
  letter-spacing:3px;padding:6px 18px;border-radius:3px;
  text-transform:uppercase;margin-bottom:20px;
  box-shadow:0 0 30px rgba(204,0,0,.5);
  animation:badge-pulse 2s ease-in-out infinite;
}
@keyframes badge-pulse{0%,100%{box-shadow:0 0 20px rgba(204,0,0,.4)}50%{box-shadow:0 0 40px rgba(204,0,0,.8)}}
.live-dot{width:8px;height:8px;background:#fff;border-radius:50%;animation:dot-blink .9s ease-in-out infinite}
@keyframes dot-blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(.5)}}

.din-tag{
  display:inline-block;background:linear-gradient(135deg,var(--gold3),var(--gold2),var(--gold));
  color:#000;font-size:10px;font-weight:800;letter-spacing:3px;
  padding:5px 20px;border-radius:40px;text-transform:uppercase;
  margin-bottom:16px;box-shadow:0 0 20px rgba(255,215,0,.3);
}
.htitle{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(56px,10vw,110px);letter-spacing:6px;line-height:.88;
  background:linear-gradient(140deg,#fff 0%,var(--green) 40%,var(--gold) 75%,#fff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:hue-drift 5s ease-in-out infinite alternate;
}
@keyframes hue-drift{
  0%{filter:drop-shadow(0 0 20px rgba(0,166,81,.3))}
  100%{filter:drop-shadow(0 0 50px rgba(255,215,0,.5))}
}
.hsub{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(18px,3vw,30px);
  letter-spacing:10px;color:var(--gold);margin:6px 0;
  text-shadow:0 0 20px rgba(212,160,23,.5);
}
.hdesc{font-size:12px;color:var(--gray);letter-spacing:3px;text-transform:uppercase}
.trophy-row{display:flex;align-items:center;justify-content:center;gap:20px;margin:30px 0 0;font-size:34px}
.trophy-row::before,.trophy-row::after{content:'';flex:1;max-width:240px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,166,81,.4))}
.trophy-row::after{background:linear-gradient(90deg,rgba(0,166,81,.4),transparent)}

/* ─── LEADER BANNER ─── */
.leader{
  background:linear-gradient(135deg,#003d1a,#006b34,#00a651,#004d20);
  border-radius:16px;padding:26px 36px;
  display:flex;align-items:center;gap:28px;
  margin-bottom:40px;position:relative;overflow:hidden;
  border:1px solid rgba(0,166,81,.35);
  box-shadow:0 8px 60px rgba(0,166,81,.3),inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .3s,box-shadow .3s;
}
.leader::before{content:'';position:absolute;top:-40%;right:-5%;width:300px;height:300px;background:rgba(255,255,255,.04);border-radius:50%}
.leader:hover{transform:translateY(-3px);box-shadow:0 20px 80px rgba(0,166,81,.45)}
.leader-crown{font-size:48px;animation:float-crown 3s ease-in-out infinite;filter:drop-shadow(0 0 15px rgba(255,215,0,.7))}
@keyframes float-crown{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
.leader-info{flex:1}
.leader-lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:.7;margin-bottom:4px}
.leader-nm{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;line-height:1}
.leader-pts{font-family:'Bebas Neue',sans-serif;font-size:76px;line-height:1;color:var(--gold);text-shadow:0 0 50px rgba(255,215,0,.8);animation:pts-glow 2.5s ease-in-out infinite alternate}
@keyframes pts-glow{0%{text-shadow:0 0 30px rgba(255,215,0,.5)}100%{text-shadow:0 0 80px rgba(255,215,0,1),0 0 120px rgba(255,215,0,.4)}}
.leader-badge{font-size:48px;animation:bounce-badge .8s ease-in-out infinite alternate}
@keyframes bounce-badge{0%{transform:scale(1) rotate(-5deg)}100%{transform:scale(1.15) rotate(5deg)}}

/* ─── TOP 6 CARDS ─── */
.sec-label{
  font-family:'Bebas Neue',sans-serif;font-size:28px;
  letter-spacing:5px;color:var(--green);margin:0 0 20px;
  display:flex;align-items:center;gap:14px;
  text-shadow:0 0 20px rgba(0,166,81,.4);
}
.sec-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(0,166,81,.5),transparent)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px;margin-bottom:52px}

.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:18px;padding:28px;position:relative;overflow:hidden;
  transition:all .4s cubic-bezier(.34,1.56,.64,1);cursor:pointer;
  opacity:0;transform:translateY(30px);
}
.card.visible{opacity:1;transform:translateY(0)}
.card::before{content:'';position:absolute;inset:0;border-radius:18px;background:radial-gradient(circle at 50% -10%,rgba(0,166,81,.07),transparent 60%);opacity:0;transition:opacity .4s}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:18px 18px 0 0;background:linear-gradient(90deg,var(--green3),var(--green),var(--green2));transform:scaleX(0);transform-origin:left;transition:transform .5s ease}
.card:hover{transform:translateY(-12px) scale(1.02);border-color:rgba(0,166,81,.3);box-shadow:0 28px 70px rgba(0,166,81,.2),0 0 0 1px rgba(0,166,81,.12)}
.card:hover::before{opacity:1}
.card:hover::after{transform:scaleX(1)}

/* rank variants */
.card.g{background:linear-gradient(150deg,#110e02,#1a1500,#0d1120);border-color:rgba(255,215,0,.2);box-shadow:0 4px 40px rgba(255,215,0,.06)}
.card.g::after{background:linear-gradient(90deg,#6a4800,var(--gold2),var(--gold))}
.card.g:hover{box-shadow:0 28px 80px rgba(255,215,0,.18),0 0 0 1px rgba(255,215,0,.2);border-color:rgba(255,215,0,.4)}

.card.s{border-color:rgba(200,200,200,.18)}
.card.s::after{background:linear-gradient(90deg,#444,var(--silver),#eee)}

.card.b{border-color:rgba(205,127,50,.2)}
.card.b::after{background:linear-gradient(90deg,#6b3800,var(--bronze),#e8a050)}

.chip{
  font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:1.5px;
  padding:4px 14px;border-radius:30px;
  background:rgba(255,255,255,.05);color:var(--gray);
}
.card.g .chip{background:rgba(255,215,0,.12);color:var(--gold);box-shadow:0 0 12px rgba(255,215,0,.2)}
.card.s .chip{background:rgba(200,200,200,.1);color:var(--silver)}
.card.b .chip{background:rgba(205,127,50,.1);color:var(--bronze)}

.c-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.c-medal{font-size:26px;transition:transform .3s}
.card:hover .c-medal{transform:scale(1.25) rotate(15deg)}
.c-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;margin-bottom:3px;transition:color .3s;line-height:1.05}
.card:hover .c-name{color:var(--green2)}
.card.g .c-name{color:var(--gold)}
.card.g:hover .c-name{color:#ffe050}
.card.s .c-name{color:var(--silver)}
.card.b .c-name{color:var(--bronze)}
.c-slogan{font-size:10px;color:var(--gray);letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}

.score-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:18px}
.score-num{font-family:'Bebas Neue',sans-serif;font-size:78px;line-height:1;text-shadow:0 0 20px rgba(255,255,255,.06)}
.card.g .score-num{color:var(--gold);text-shadow:0 0 40px rgba(255,215,0,.45);animation:pts-glow 3s ease-in-out infinite alternate}
.card.s .score-num{color:var(--silver)}
.card.b .score-num{color:var(--bronze)}
.score-lbl{font-size:13px;color:var(--gray);margin-bottom:14px;letter-spacing:1px;text-transform:uppercase}

.prog-wrap{margin-top:4px}
.prog-hdr{display:flex;justify-content:space-between;font-size:9px;color:var(--gray);letter-spacing:2px;text-transform:uppercase;margin-bottom:7px}
.prog-track{height:5px;background:rgba(255,255,255,.05);border-radius:5px;overflow:hidden}
.prog-fill{height:100%;border-radius:5px;width:0;background:linear-gradient(90deg,var(--green3),var(--green),var(--green2));position:relative;transition:width 1.4s cubic-bezier(.34,1.2,.64,1)}
.prog-fill::after{content:'';position:absolute;top:0;right:0;width:8px;height:100%;background:rgba(255,255,255,.8);border-radius:50%;filter:blur(2px);animation:shine 2s ease-in-out infinite}
@keyframes shine{0%,100%{opacity:.5}50%{opacity:1}}
.card.g .prog-fill{background:linear-gradient(90deg,#6a4800,var(--gold2),var(--gold))}
.card.s .prog-fill{background:linear-gradient(90deg,#444,var(--silver))}
.card.b .prog-fill{background:linear-gradient(90deg,#6b3800,var(--bronze))}

/* ─── RANKING TABLE ─── */
.tbl-wrap{background:var(--card2);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 10px 50px rgba(0,0,0,.5)}
.tbl-head{
  display:grid;grid-template-columns:56px 1fr 90px 110px 72px;
  padding:14px 28px;background:rgba(255,255,255,.025);
  border-bottom:1px solid var(--border);
  font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gray);
}
.tbl-row{
  display:grid;grid-template-columns:56px 1fr 90px 110px 72px;
  padding:15px 28px;border-bottom:1px solid rgba(255,255,255,.03);
  align-items:center;transition:all .25s ease;cursor:default;
  opacity:0;transform:translateX(-20px);
}
.tbl-row.vis{opacity:1;transform:translateX(0)}
.tbl-row:last-child{border-bottom:none}
.tbl-row:hover{background:rgba(0,166,81,.06);padding-left:36px}
.tbl-row.rg{background:rgba(255,215,0,.03)}
.tbl-row.rs{background:rgba(200,200,200,.02)}
.tbl-row.rb{background:rgba(205,127,50,.02)}
.tbl-row.rg:hover{background:rgba(255,215,0,.07)}

.t-num{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gray)}
.t-num.g{color:var(--gold);text-shadow:0 0 10px rgba(255,215,0,.4)}
.t-num.s{color:var(--silver)}
.t-num.b{color:var(--bronze)}
.t-name{font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.t-pts{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;text-align:center}
.tbl-row.rg .t-pts{color:var(--gold)}
.tbl-row.rs .t-pts{color:var(--silver)}
.tbl-row.rb .t-pts{color:var(--bronze)}
.t-bar-w{height:6px;background:rgba(255,255,255,.05);border-radius:6px;overflow:hidden}
.t-bar-f{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green3),var(--green));width:0;transition:width 1.2s ease}
.tbl-row.rg .t-bar-f{background:linear-gradient(90deg,#7a5000,var(--gold))}
.tbl-row.rs .t-bar-f{background:linear-gradient(90deg,#555,var(--silver))}
.tbl-row.rb .t-bar-f{background:linear-gradient(90deg,#6b3800,var(--bronze))}
.t-medal{text-align:right;font-size:20px}

/* ─── SEARCH ─── */
.search-wrap{margin-bottom:18px;position:relative}
.search-inp{
  width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:12px 18px 12px 46px;
  color:#fff;font-size:13px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.search-inp:focus{border-color:rgba(0,166,81,.4);box-shadow:0 0 20px rgba(0,166,81,.1)}
.search-ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.4}

/* ─── STATS STRIP ─── */
.stats-strip{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:14px;margin-bottom:44px;
}
.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:18px 16px;text-align:center;
  transition:transform .3s,box-shadow .3s;cursor:default;
}
.stat-card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,166,81,.12)}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--green);line-height:1;margin-bottom:4px}
.stat-lbl{font-size:9px;color:var(--gray);letter-spacing:2px;text-transform:uppercase}

/* ─── CONFETTI ─── */
.cf{position:fixed;top:-12px;pointer-events:none;z-index:999;border-radius:2px;animation:cf-fall linear forwards}
@keyframes cf-fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* ─── FOOTER ─── */
.footer{text-align:center;padding:30px;color:var(--gray);font-size:10px;letter-spacing:3px;text-transform:uppercase;border-top:1px solid rgba(255,255,255,.04);margin-top:40px}
.pulse-dot{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:8px;animation:pulse-ring 2s ease infinite}
@keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(0,166,81,.6)}70%{box-shadow:0 0 0 10px rgba(0,166,81,0)}100%{box-shadow:0 0 0 0 rgba(0,166,81,0)}}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--green3);border-radius:3px}

@media(max-width:640px){
  .tbl-head,.tbl-row{grid-template-columns:44px 1fr 70px 0 48px}
  .t-bar-w{display:none}
  .leader-pts{font-size:52px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- BG -->
<canvas id="bg"></canvas>
<div class="bg-field"></div>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<!-- TICKER -->
<div class="ticker-bar">
  <div class="ticker-label">⚽ AO VIVO</div>
  <div style="overflow:hidden;flex:1">
    <div class="ticker-track" id="ticker"></div>
  </div>
</div>

<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <div class="live-badge"><div class="live-dot"></div> AO VIVO</div>
    <div style="margin-bottom:10px"><span class="din-tag">🏅 1ª Dinâmica — Resultado Oficial</span></div>
    <div class="htitle">COPA 2026</div>
    <div class="hsub">Championship</div>
    <div class="hdesc">Placar de Desempenho por Equipe</div>
    <div class="trophy-row">🏆</div>
  </div>

  <!-- STATS STRIP -->
  <div class="stats-strip" id="statsStrip"></div>

  <!-- LEADER -->
  <div class="leader" id="leader">
    <div class="leader-crown">👑</div>
    <div class="leader-info">
      <div class="leader-lbl">Líder da 1ª Dinâmica</div>
      <div class="leader-nm" id="lName">—</div>
    </div>
    <div class="leader-pts" id="lPts">—</div>
    <div class="leader-badge">🥇</div>
  </div>

  <!-- TOP 6 -->
  <div class="sec-label">🏆 Top 6 — Destaques</div>
  <div class="grid" id="topGrid"></div>

  <!-- FULL RANKING -->
  <div class="sec-label">📋 Classificação Geral — Todos os Participantes</div>
  <div class="search-wrap">
    <span class="search-ico">🔍</span>
    <input class="search-inp" type="text" id="searchInp" placeholder="Buscar equipe...">
  </div>
  <div class="tbl-wrap">
    <div class="tbl-head">
      <span>Pos</span><span>Equipe</span>
      <span style="text-align:center">Pts</span>
      <span>Desempenho</span>
      <span style="text-align:right"></span>
    </div>
    <div id="fullTable"></div>
  </div>

</div>

<div class="footer">
  <span class="pulse-dot"></span>
  1ª Dinâmica · Resultado Oficial · FIFA World Cup 2026 Style
</div>

<script>
// ═══════════════════════════════════════════════════════
// DADOS — TODOS OS 23 PARTICIPANTES
// ═══════════════════════════════════════════════════════
const raw = [
  { name:"Campinas",                score:120 },
  { name:"Comercial RJ",            score:114 },
  { name:"Adm. e Copa SP",          score:114 },
  { name:"Ribeirão Preto",          score:112 },
  { name:"Belo Horizonte",          score:110 },
  { name:"TI Rio de Janeiro",       score:105 },
  { name:"CID Imobiliário RJ",      score:103 },
  { name:"Joinville",               score:99  },
  { name:"Jurídico Curitiba",       score:97  },
  { name:"Arquivo e Auditoria RJ",  score:96  },
  { name:"Manaus",                  score:96  },
  { name:"Recepção e Copa RJ",      score:92  },
  { name:"Comercial SP",            score:84  },
  { name:"Jur. Tributário RJ",      score:66  },
  { name:"Jur. Trabalhista RJ",     score:61  },
  { name:"Jurídico SP",             score:61  },
  { name:"Contab. e TI SP",         score:60  },
  { name:"Espírito Santo",          score:56  },
  { name:"Comercial Salvador",      score:44  },
  { name:"Contabilidade Salvador",  score:44  },
  { name:"Jurídico Salvador",       score:44  },
  { name:"Pernambuco",              score:36  },
  { name:"Piraúba",                 score:33  },
];

// Ordena e atribui posição (com empate)
const teams = [...raw].sort((a,b) => b.score - a.score);
const maxPts = teams[0].score;
let pos = 1;
teams.forEach((t, i) => {
  if (i > 0 && t.score < teams[i-1].score) pos = i + 1;
  t.pos = pos;
});

// Medal info baseado em score
const s1 = teams[0].score;
const s2 = teams.find(t => t.score < s1)?.score;
const s3 = teams.find(t => t.score < s2)?.score;

function medal(t) {
  if (t.score === s1) return { card:'g', chip:'🥇 OURO',   badge:'🥇', num:'g', row:'rg', slogan:'Campeões da 1ª Dinâmica'  };
  if (t.score === s2) return { card:'s', chip:'🥈 PRATA',  badge:'🥈', num:'s', row:'rs', slogan:'Finalistas de Elite'       };
  if (t.score === s3) return { card:'b', chip:'🥉 BRONZE', badge:'🥉', num:'b', row:'rb', slogan:'Pódio Garantido'            };
  return { card:'', chip:`#${t.pos} LUGAR`, badge:'🎖️', num:'', row:'', slogan:'Em Campo pela Vitória' };
}

const slogans = {
  "Campinas":"Campeões da 1ª Dinâmica","Comercial RJ":"Força no Campo de Vendas",
  "Adm. e Copa SP":"Eficiência em Campo","Ribeirão Preto":"Precisão e Determinação",
  "Belo Horizonte":"Estratégia Mineira","TI Rio de Janeiro":"Inovação em Campo",
  "CID Imobiliário RJ":"Garra Imobiliária","Joinville":"Sul com Determinação",
  "Jurídico Curitiba":"Direito à Vitória","Arquivo e Auditoria RJ":"Ordem e Resultado",
  "Manaus":"Amazônia em Campo","Recepção e Copa RJ":"Acolhendo o Sucesso",
  "Comercial SP":"Negócios que Vencem","Jur. Tributário RJ":"Tributando Conquistas",
  "Jur. Trabalhista RJ":"Trabalhando pela Vitória","Jurídico SP":"Letra da Lei em Campo",
  "Contab. e TI SP":"Dados e Resultados","Espírito Santo":"Capixaba que Não Para",
  "Comercial Salvador":"Bahia em Campo","Contabilidade Salvador":"Números da Bahia",
  "Jurídico Salvador":"Direito Baiano","Pernambuco":"Nordeste com Garra",
  "Piraúba":"Zona da Mata Presente",
};

// ─── TICKER ───
const top = () => {
  const dups = [];
  const seen = new Set();
  for (let i = 0; i < teams.length; i++) {
    const t = teams[i];
    if (!seen.has(t.name)) { seen.add(t.name); dups.push(t); }
  }
  return dups;
};
function buildTicker() {
  const tr = document.getElementById('ticker');
  const items = [...top(), ...top()]; // duplica para loop
  items.forEach(t => {
    const d = document.createElement('div');
    d.className = 'ticker-item';
    d.innerHTML = `${medal(t).badge} ${t.name} <span>${t.score} pts</span>`;
    tr.appendChild(d);
  });
}
buildTicker();

// ─── STATS STRIP ───
function buildStats() {
  const el = document.getElementById('statsStrip');
  const stats = [
    { num: teams.length,                   lbl: 'Equipes' },
    { num: teams.reduce((s,t)=>s+t.score,0), lbl: 'Pontos totais' },
    { num: maxPts,                          lbl: 'Maior pontuação' },
    { num: Math.round(teams.reduce((s,t)=>s+t.score,0)/teams.length), lbl: 'Média geral' },
    { num: teams[teams.length-1].score,    lbl: 'Menor pontuação' },
    { num: teams.filter(t=>t.score>=100).length, lbl: 'Acima de 100 pts' },
  ];
  stats.forEach(s => {
    el.innerHTML += `<div class="stat-card">
      <div class="stat-num" data-target="${s.num}">0</div>
      <div class="stat-lbl">${s.lbl}</div>
    </div>`;
  });
}
buildStats();

// ─── COUNT-UP ANIMATION ───
function countUp(el, target, duration=1800) {
  let start = null;
  function step(ts) {
    if (!start) start = ts;
    const p = Math.min((ts-start)/duration, 1);
    const ease = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(ease * target).toLocaleString('pt-BR');
    if (p < 1) requestAnimationFrame(step);
    else el.textContent = target.toLocaleString('pt-BR');
  }
  requestAnimationFrame(step);
}

// ─── LEADER ───
function buildLeader() {
  const t = teams[0];
  document.getElementById('lName').textContent = t.name;
  countUp(document.getElementById('lPts'), t.score, 2000);
}
buildLeader();

// ─── TOP 6 CARDS ───
function buildTopCards() {
  const grid = document.getElementById('topGrid');
  const top6 = teams.slice(0, 6);
  top6.forEach((t, idx) => {
    const m   = medal(t);
    const pct = Math.round((t.score / maxPts) * 100);
    const sl  = slogans[t.name] || m.slogan;
    const card = document.createElement('div');
    card.className = `card ${m.card}`;
    card.dataset.score = t.score;
    card.innerHTML = `
      <div class="c-head">
        <span class="chip">${m.chip}</span>
        <span class="c-medal">${m.badge}</span>
      </div>
      <div class="c-name">${t.name}</div>
      <div class="c-slogan">${sl}</div>
      <div class="score-row">
        <div class="score-num" data-target="${t.score}">0</div>
        <div class="score-lbl">pts</div>
      </div>
      <div class="prog-wrap">
        <div class="prog-hdr"><span>Desempenho</span><span>${pct}%</span></div>
        <div class="prog-track"><div class="prog-fill" data-pct="${pct}"></div></div>
      </div>
    `;
    grid.appendChild(card);
    // staggered entrance
    setTimeout(() => {
      card.classList.add('visible');
      const numEl = card.querySelector('.score-num');
      countUp(numEl, t.score, 1600 + idx * 100);
      setTimeout(() => {
        card.querySelector('.prog-fill').style.width = pct + '%';
      }, 400 + idx * 80);
    }, 200 + idx * 120);
  });
}
buildTopCards();

// ─── FULL RANKING TABLE ───
let allRows = [];
function buildTable(filter='') {
  const tbl = document.getElementById('fullTable');
  tbl.innerHTML = '';
  const filtered = filter
    ? teams.filter(t => t.name.toLowerCase().includes(filter.toLowerCase()))
    : teams;

  filtered.forEach((t, i) => {
    const m   = medal(t);
    const pct = Math.round((t.score / maxPts) * 100);
    const row = document.createElement('div');
    row.className = `tbl-row ${m.row}`;
    row.innerHTML = `
      <div class="t-num ${m.num}">${t.pos}</div>
      <div class="t-name">${m.badge} ${t.name}</div>
      <div class="t-pts">${t.score}</div>
      <div class="t-bar-w"><div class="t-bar-f" data-pct="${pct}"></div></div>
      <div class="t-medal">${m.badge}</div>
    `;
    tbl.appendChild(row);
    setTimeout(() => {
      row.classList.add('vis');
      row.querySelector('.t-bar-f').style.width = pct + '%';
    }, 60 + i * 35);
  });
  allRows = [...tbl.querySelectorAll('.tbl-row')];
}
buildTable();

document.getElementById('searchInp').addEventListener('input', e => {
  buildTable(e.target.value.trim());
});

// ─── INTERSECTION OBSERVER (scroll reveal) ───
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      // stats count-up
      if (e.target.classList.contains('stat-card')) {
        const n = e.target.querySelector('.stat-num');
        if (n && n.textContent === '0') {
          countUp(n, parseInt(n.dataset.target), 1400);
        }
      }
    }
  });
}, { threshold: .3 });

document.querySelectorAll('.stat-card').forEach(el => io.observe(el));

// ─── CONFETTI on load ───
function spawnConfetti(count=60) {
  const cols = ['#00A651','#FFD700','#fff','#4DCC85','#FFB700','#C0C0C0','#CD7F32'];
  for (let i=0;i<count;i++) {
    const el = document.createElement('div');
    el.className='cf';
    el.style.cssText=`left:${Math.random()*100}vw;background:${cols[Math.floor(Math.random()*cols.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;animation-duration:${1.8+Math.random()*2.2}s;animation-delay:${Math.random()*1.2}s`;
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}
setTimeout(spawnConfetti, 800);
setTimeout(()=>spawnConfetti(30), 3000);

// ─── BACKGROUND CANVAS ───
(function(){
  const cv = document.getElementById('bg');
  const cx = cv.getContext('2d');
  let W,H;
  const resize=()=>{W=cv.width=window.innerWidth;H=cv.height=window.innerHeight};

  // beams
  const beams = Array.from({length:5},(_,i)=>({
    ox:(i+.5)/5, angle:-Math.PI/2+(Math.random()-.5)*.5,
    spd:(Math.random()-.5)*.0025,
    a:.022+Math.random()*.022, hw:.035+Math.random()*.03,
    col:Math.random()>.5?'0,166,81':'212,160,23'
  }));

  // particles
  const pts=[];
  class Pt{
    constructor(){this.reset()}
    reset(){this.x=Math.random()*W;this.y=Math.random()*H;this.r=Math.random()*1.6+.2;this.vx=(Math.random()-.5)*.3;this.vy=(Math.random()-.5)*.3;this.a=Math.random()*.3+.03;this.c=['0,166,81','212,160,23','255,255,255'][~~(Math.random()*3)]}
    tick(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W)this.vx*=-1;if(this.y<0||this.y>H)this.vy*=-1}
  }
  for(let i=0;i<120;i++) pts.push(new Pt());

  // connecting lines between nearby particles
  function drawLines(){
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){
        const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<100){
          cx.beginPath();cx.moveTo(pts[i].x,pts[i].y);cx.lineTo(pts[j].x,pts[j].y);
          cx.strokeStyle=`rgba(0,166,81,${(.06*(1-d/100))})`;cx.lineWidth=.5;cx.stroke();
        }
      }
    }
  }

  function draw(){
    cx.clearRect(0,0,W,H);
    beams.forEach(b=>{
      b.angle+=b.spd;
      const sx=b.ox*W, hw=b.hw*W;
      const ex=sx+Math.tan(b.angle)*H*1.5;
      const g=cx.createLinearGradient(sx,H,ex,-H*.5);
      g.addColorStop(0,`rgba(${b.col},${b.a})`);
      g.addColorStop(.6,`rgba(${b.col},${b.a*.4})`);
      g.addColorStop(1,'rgba(0,0,0,0)');
      cx.save();cx.beginPath();
      cx.moveTo(sx-hw,H);cx.lineTo(sx+hw,H);cx.lineTo(ex+hw,-H*.5);cx.lineTo(ex-hw,-H*.5);
      cx.closePath();cx.fillStyle=g;cx.fill();cx.restore();
    });
    drawLines();
    pts.forEach(p=>{
      cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);
      cx.fillStyle=`rgba(${p.c},${p.a})`;cx.fill();
      p.tick();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',()=>{resize();pts.forEach(p=>p.reset())});
  resize();draw();
})();
</script>
