<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placar Copa 2026 — Departamentos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap');

  :root {
    --green: #00A651;
    --green-light: #4DCC85;
    --green-dark: #006B34;
    --gold: #D4A017;
    --gold-light: #FFD700;
    --black: #0a0a0a;
    --dark: #111111;
    --card: #161616;
    --white: #FFFFFF;
    --gray: #888;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* PARTICLES */
  #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

  .container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 20px 60px; }

  /* HEADER */
  .header {
    text-align: center;
    padding: 48px 20px 32px;
    position: relative;
  }

  .header::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 600px; height: 3px;
    background: linear-gradient(90deg, transparent, var(--green), var(--gold), var(--green), transparent);
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #cc0000;
    color: white;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 4px 12px;
    border-radius: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .live-dot {
    width: 7px; height: 7px;
    background: white;
    border-radius: 50%;
    animation: pulse-dot 1s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 8vw, 90px);
    letter-spacing: 4px;
    line-height: 0.9;
    background: linear-gradient(135deg, #ffffff 0%, #00A651 50%, #FFD700 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }

  .header-sub {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(18px, 3vw, 28px);
    letter-spacing: 8px;
    color: var(--gold);
    margin-bottom: 4px;
  }

  .header-desc {
    font-size: 13px;
    color: var(--gray);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .trophy-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: 24px 0 0;
    font-size: 28px;
  }

  .trophy-line::before,
  .trophy-line::after {
    content: '';
    flex: 1;
    max-width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--green-dark));
  }
  .trophy-line::after {
    background: linear-gradient(90deg, var(--green-dark), transparent);
  }

  /* RANKING LEADER */
  .leader-banner {
    background: linear-gradient(135deg, #006B34 0%, #00A651 50%, #4DCC85 100%);
    border-radius: 12px;
    padding: 20px 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0, 166, 81, 0.4);
    cursor: default;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .leader-banner:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 60px rgba(0, 166, 81, 0.6);
  }

  .leader-banner::before {
    content: '';
    position: absolute;
    top: -50%; right: -10%;
    width: 250px; height: 250px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
  }

  .leader-crown { font-size: 40px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

  .leader-info { flex: 1; }
  .leader-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.8; margin-bottom: 4px; }
  .leader-name { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 2px; }
  .leader-score-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 60px;
    line-height: 1;
    color: var(--gold-light);
    text-shadow: 0 0 30px rgba(255,215,0,0.6);
  }

  /* CARDS GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
  }

  .card {
    background: var(--card);
    border: 1px solid #222;
    border-radius: 16px;
    padding: 24px;
    position: relative;
    overflow: hidden;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(0,166,81,0.08), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 16px 16px 0 0;
    background: linear-gradient(90deg, var(--green), var(--gold));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s ease;
  }

  .card:hover {
    transform: translateY(-8px) scale(1.02);
    border-color: var(--green-dark);
    box-shadow: 0 20px 60px rgba(0,166,81,0.25), 0 0 0 1px rgba(0,166,81,0.2);
  }

  .card:hover::before { opacity: 1; }
  .card:hover::after { transform: scaleX(1); }

  .card.rank-1 { border-color: rgba(212,160,23,0.4); }
  .card.rank-1::after { background: linear-gradient(90deg, var(--gold), var(--gold-light)); }
  .card.rank-1:hover { box-shadow: 0 20px 60px rgba(212,160,23,0.3), 0 0 0 1px rgba(212,160,23,0.3); }

  .card.rank-2 { border-color: rgba(192,192,192,0.3); }
  .card.rank-3 { border-color: rgba(205,127,50,0.3); }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .card-rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.06);
    color: var(--gray);
  }

  .card.rank-1 .card-rank { background: rgba(212,160,23,0.2); color: var(--gold-light); }
  .card.rank-2 .card-rank { background: rgba(192,192,192,0.15); color: #ccc; }
  .card.rank-3 .card-rank { background: rgba(205,127,50,0.15); color: #cd7f32; }

  .card-medal { font-size: 22px; }

  .dept-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 2px;
    margin-bottom: 4px;
    color: var(--white);
    transition: color 0.3s;
  }

  .card:hover .dept-name { color: var(--green-light); }

  .dept-slogan {
    font-size: 11px;
    color: var(--gray);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  /* SCORE */
  .score-area {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .score-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 64px;
    line-height: 1;
    color: var(--white);
    min-width: 90px;
    text-align: center;
    transition: all 0.3s;
    text-shadow: 0 0 20px rgba(255,255,255,0.1);
  }

  .card.rank-1 .score-display {
    color: var(--gold-light);
    text-shadow: 0 0 30px rgba(255,215,0,0.4);
  }

  .score-btns {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .btn-score {
    width: 36px; height: 36px;
    border: none;
    border-radius: 8px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .btn-plus {
    background: var(--green-dark);
    color: var(--white);
  }

  .btn-plus:hover {
    background: var(--green);
    transform: scale(1.15);
    box-shadow: 0 4px 16px rgba(0,166,81,0.5);
  }

  .btn-minus {
    background: #2a0a0a;
    color: #cc4444;
  }

  .btn-minus:hover {
    background: #440000;
    transform: scale(1.15);
    box-shadow: 0 4px 16px rgba(204,0,0,0.3);
  }

  /* PROGRESS BAR */
  .progress-wrap {
    margin-top: 16px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--gray);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .progress-bar {
    height: 4px;
    background: #222;
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--green-dark), var(--green), var(--green-light));
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 6px; height: 100%;
    background: white;
    border-radius: 50%;
    filter: blur(2px);
    animation: glow-move 2s ease-in-out infinite;
  }

  @keyframes glow-move {
    0%,100%{opacity:0.6} 50%{opacity:1}
  }

  .card.rank-1 .progress-fill {
    background: linear-gradient(90deg, #a07000, var(--gold), var(--gold-light));
  }

  /* RANKING TABLE */
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 4px;
    color: var(--green);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--green-dark), transparent);
  }

  .table-wrap {
    background: var(--card);
    border: 1px solid #222;
    border-radius: 16px;
    overflow: hidden;
  }

  .table-head {
    display: grid;
    grid-template-columns: 60px 1fr 100px 100px 80px;
    padding: 14px 24px;
    background: #1a1a1a;
    border-bottom: 1px solid #2a2a2a;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gray);
  }

  .table-row {
    display: grid;
    grid-template-columns: 60px 1fr 100px 100px 80px;
    padding: 16px 24px;
    border-bottom: 1px solid #1a1a1a;
    align-items: center;
    transition: all 0.3s;
    cursor: default;
  }

  .table-row:last-child { border-bottom: none; }

  .table-row:hover {
    background: rgba(0,166,81,0.06);
    padding-left: 30px;
  }

  .table-row.first { background: rgba(212,160,23,0.06); }
  .table-row.second { background: rgba(192,192,192,0.04); }
  .table-row.third { background: rgba(205,127,50,0.04); }

  .t-pos {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--gray);
  }

  .t-pos.gold { color: var(--gold-light); }
  .t-pos.silver { color: #ccc; }
  .t-pos.bronze { color: #cd7f32; }

  .t-name {
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .t-pts {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--white);
    text-align: center;
  }

  .table-row.first .t-pts { color: var(--gold-light); }

  .t-bar-wrap {
    height: 6px;
    background: #222;
    border-radius: 6px;
    overflow: hidden;
  }

  .t-bar {
    height: 100%;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--green-dark), var(--green));
    transition: width 0.6s ease;
  }

  .table-row.first .t-bar { background: linear-gradient(90deg, #a07000, var(--gold-light)); }

  .t-trend {
    text-align: right;
    font-size: 18px;
  }

  /* SCORE BUMP ANIMATION */
  @keyframes score-bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.3); color: var(--green-light); }
    100% { transform: scale(1); }
  }

  .bump { animation: score-bump 0.4s ease; }

  /* CONFETTI */
  .confetti-piece {
    position: fixed;
    width: 8px;
    height: 8px;
    top: -10px;
    border-radius: 2px;
    animation: confetti-fall linear forwards;
    pointer-events: none;
    z-index: 999;
  }

  @keyframes confetti-fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* FOOTER */
  .footer {
    text-align: center;
    padding: 24px;
    color: var(--gray);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-top: 1px solid #1a1a1a;
    margin-top: 40px;
  }

  .pulse-ring {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--green);
    border-radius: 50%;
    margin-right: 6px;
    animation: pulse-ring 2s ease infinite;
  }

  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(0,166,81,0.6); }
    70% { box-shadow: 0 0 0 10px rgba(0,166,81,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,166,81,0); }
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--black); }
  ::-webkit-scrollbar-thumb { background: var(--green-dark); border-radius: 3px; }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="live-badge"><div class="live-dot"></div> AO VIVO</div>
    <div class="header-title">COPA 2026</div>
    <div class="header-sub">Fradema Championship</div>
    <div class="header-desc">Placar de Desempenho por Departamento</div>
    <div class="trophy-line">🏆</div>
  </div>

  <!-- LEADER BANNER -->
  <div class="leader-banner" id="leaderBanner">
    <div class="leader-crown">👑</div>
    <div class="leader-info">
      <div class="leader-label">Lider Atual</div>
      <div class="leader-name" id="leaderName">Departamento 3</div>
    </div>
    <div class="leader-score-big" id="leaderScore">52</div>
  </div>

  <!-- CARDS -->
  <div class="grid" id="cardsGrid"></div>

  <!-- RANKING TABLE -->
  <div class="section-title">🏅 Classificacao Geral</div>
  <div class="table-wrap">
    <div class="table-head">
      <span>Pos</span>
      <span>Departamento</span>
      <span style="text-align:center">Pontos</span>
      <span>Desempenho</span>
      <span style="text-align:right">Tend.</span>
    </div>
    <div id="rankingTable"></div>
  </div>

</div>

<div class="footer">
  <span class="pulse-ring"></span>
  Placar atualizado em tempo real · FIFA World Cup 2026 Style · Fradema
</div>

<script>
const depts = [
  { id: 1, name: "Departamento 1", slogan: "Força e Determinação",  score: 47, prev: 42 },
  { id: 2, name: "Departamento 2", slogan: "Precisão em Campo",     score: 35, prev: 38 },
  { id: 3, name: "Departamento 3", slogan: "Líderes por Natureza",  score: 52, prev: 48 },
  { id: 4, name: "Departamento 4", slogan: "Garra e Superação",     score: 28, prev: 25 },
  { id: 5, name: "Departamento 5", slogan: "Estratégia Vencedora",  score: 41, prev: 41 },
  { id: 6, name: "Departamento 6", slogan: "Unidos pelo Resultado", score: 19, prev: 22 },
];

const medals = ["🥇","🥈","🥉","🎖️","🎖️","🎖️"];
const colors = ["#FFD700","#C0C0C0","#CD7F32","#00A651","#00A651","#00A651"];

function getMax() { return Math.max(...depts.map(d => d.score)); }

function renderCards() {
  const sorted = [...depts].sort((a,b) => b.score - a.score);
  const max = getMax();
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';

  depts.forEach(dept => {
    const rank = sorted.findIndex(d => d.id === dept.id) + 1;
    const pct = max > 0 ? (dept.score / max) * 100 : 0;
    const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
    const card = document.createElement('div');
    card.className = `card ${rankClass}`;
    card.id = `card-${dept.id}`;
    card.innerHTML = `
      <div class="card-header">
        <span class="card-rank">${rank === 1 ? '🥇 LÍDER' : rank === 2 ? '🥈 2º LUGAR' : rank === 3 ? '🥉 3º LUGAR' : `#${rank} LUGAR`}</span>
        <span class="card-medal">${medals[rank-1]}</span>
      </div>
      <div class="dept-name">${dept.name}</div>
      <div class="dept-slogan">${dept.slogan}</div>
      <div class="score-area">
        <div class="score-display" id="score-${dept.id}">${dept.score}</div>
        <div class="score-btns">
          <button class="btn-score btn-plus" onclick="updateScore(${dept.id}, 1)">＋</button>
          <button class="btn-score btn-minus" onclick="updateScore(${dept.id}, -1)">－</button>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-label">
          <span>Desempenho</span>
          <span>${Math.round(pct)}%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${pct}%"></div>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  updateRanking();
  updateLeader();
}

function updateRanking() {
  const sorted = [...depts].sort((a,b) => b.score - a.score);
  const max = getMax();
  const table = document.getElementById('rankingTable');
  table.innerHTML = '';

  sorted.forEach((dept, idx) => {
    const pct = max > 0 ? (dept.score / max) * 100 : 0;
    const rowClass = idx === 0 ? 'first' : idx === 1 ? 'second' : idx === 2 ? 'third' : '';
    const posClass = idx === 0 ? 'gold' : idx === 1 ? 'silver' : idx === 2 ? 'bronze' : '';
    const trend = dept.score > dept.prev ? '📈' : dept.score < dept.prev ? '📉' : '➡️';
    const row = document.createElement('div');
    row.className = `table-row ${rowClass}`;
    row.innerHTML = `
      <div class="t-pos ${posClass}">${idx + 1}</div>
      <div class="t-name">${medals[idx]} ${dept.name}</div>
      <div class="t-pts">${dept.score}</div>
      <div class="t-bar-wrap"><div class="t-bar" style="width:${pct}%"></div></div>
      <div class="t-trend">${trend}</div>
    `;
    table.appendChild(row);
  });
}

function updateLeader() {
  const leader = [...depts].sort((a,b) => b.score - a.score)[0];
  document.getElementById('leaderName').textContent = leader.name;
  document.getElementById('leaderScore').textContent = leader.score;
}

function updateScore(id, delta) {
  const dept = depts.find(d => d.id === id);
  if (!dept) return;
  dept.prev = dept.score;
  dept.score = Math.max(0, dept.score + delta);

  const el = document.getElementById(`score-${id}`);
  if (el) {
    el.textContent = dept.score;
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  if (delta > 0) spawnConfetti();
  renderCards();
}

function spawnConfetti() {
  const colors = ['#00A651','#FFD700','#ffffff','#4DCC85','#FFB700'];
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = (6 + Math.random() * 8) + 'px';
    el.style.height = (6 + Math.random() * 8) + 'px';
    el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    el.style.animationDelay = (Math.random() * 0.4) + 's';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

// PARTICLES CANVAS
(function () {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function Particle() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.r = Math.random() * 1.5 + 0.3;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = (Math.random() - 0.5) * 0.3;
    this.alpha = Math.random() * 0.4 + 0.05;
    this.color = Math.random() > 0.5 ? '0,166,81' : '212,160,23';
  }

  function init() {
    particles = Array.from({length: 80}, () => new Particle());
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
      ctx.fill();
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); init(); });
  resize(); init(); draw();
})();

// INIT
renderCards();
</script>
</body>
</html>
