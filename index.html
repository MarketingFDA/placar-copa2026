<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placar Copa 2026 — 1ª Dinâmica</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap');

  :root {
    --green: #00A651;
    --green-light: #4DCC85;
    --green-dark: #006B34;
    --gold: #D4A017;
    --gold-light: #FFD700;
    --silver: #C0C0C0;
    --bronze: #CD7F32;
    --black: #060810;
    --dark: #0d0f1a;
    --card: #10131f;
    --card2: #13162a;
    --white: #FFFFFF;
    --gray: #7a8099;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== BACKGROUND LAYERS ===== */
  #bg-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }

  .bg-grid {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(0,166,81,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,166,81,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: grid-shift 20s linear infinite;
  }

  @keyframes grid-shift {
    0% { background-position: 0 0; }
    100% { background-position: 60px 60px; }
  }

  .bg-spotlight {
    position: fixed; pointer-events: none; z-index: 0;
    border-radius: 50%; filter: blur(100px);
    animation: spotlight-drift 12s ease-in-out infinite alternate;
  }

  .bg-spotlight.s1 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(0,166,81,0.07) 0%, transparent 70%);
    top: -100px; left: -100px;
    animation-duration: 14s;
  }

  .bg-spotlight.s2 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(212,160,23,0.06) 0%, transparent 70%);
    bottom: -100px; right: -100px;
    animation-duration: 10s; animation-delay: -5s;
  }

  .bg-spotlight.s3 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(0,100,200,0.04) 0%, transparent 70%);
    top: 40%; left: 50%;
    animation-duration: 18s; animation-delay: -8s;
  }

  @keyframes spotlight-drift {
    0%   { transform: translate(0, 0) scale(1); }
    33%  { transform: translate(60px, 40px) scale(1.1); }
    66%  { transform: translate(-40px, 60px) scale(0.95); }
    100% { transform: translate(30px, -30px) scale(1.05); }
  }

  .hexagons {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
    overflow: hidden; opacity: 0.18;
  }

  .hex {
    position: absolute;
    width: 60px; height: 52px;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    border: 1px solid rgba(0,166,81,0.3);
    background: transparent;
    animation: hex-pulse var(--dur, 4s) ease-in-out infinite var(--delay, 0s) alternate;
  }

  @keyframes hex-pulse {
    0%   { opacity: 0.05; background: transparent; }
    100% { opacity: 0.4; background: rgba(0,166,81,0.04); }
  }

  /* ===== LAYOUT ===== */
  .container {
    position: relative; z-index: 1;
    max-width: 1200px; margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* ===== HEADER ===== */
  .header {
    text-align: center;
    padding: 52px 20px 36px;
    position: relative;
  }

  .header::before {
    content: '';
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 80%; max-width: 700px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--green), var(--gold), var(--green), transparent);
    box-shadow: 0 0 20px rgba(0,166,81,0.4);
  }

  .live-badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: linear-gradient(135deg, #8b0000, #cc0000);
    color: white; font-size: 11px; font-weight: 700;
    letter-spacing: 3px; padding: 5px 16px;
    border-radius: 2px; text-transform: uppercase;
    margin-bottom: 18px;
    box-shadow: 0 0 20px rgba(204,0,0,0.4);
  }

  .live-dot {
    width: 7px; height: 7px; background: white; border-radius: 50%;
    animation: pulse-dot 1s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.6); }
  }

  .header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 9vw, 100px);
    letter-spacing: 6px; line-height: 0.9;
    background: linear-gradient(135deg, #ffffff 0%, #00A651 45%, #FFD700 80%, #ffffff 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 4px;
    filter: drop-shadow(0 0 30px rgba(0,166,81,0.3));
    animation: title-shimmer 4s ease-in-out infinite alternate;
  }

  @keyframes title-shimmer {
    0%   { filter: drop-shadow(0 0 20px rgba(0,166,81,0.2)); }
    100% { filter: drop-shadow(0 0 40px rgba(255,215,0,0.4)); }
  }

  .header-sub {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(16px, 2.5vw, 26px);
    letter-spacing: 10px; color: var(--gold);
    margin-bottom: 6px;
    text-shadow: 0 0 20px rgba(212,160,23,0.5);
  }

  .header-desc {
    font-size: 12px; color: var(--gray);
    letter-spacing: 3px; text-transform: uppercase;
  }

  .trophy-line {
    display: flex; align-items: center; justify-content: center;
    gap: 20px; margin: 28px 0 0; font-size: 32px;
  }

  .trophy-line::before, .trophy-line::after {
    content: ''; flex: 1; max-width: 220px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,166,81,0.4));
  }
  .trophy-line::after {
    background: linear-gradient(90deg, rgba(0,166,81,0.4), transparent);
  }

  /* ===== LEADER BANNER ===== */
  .leader-banner {
    background: linear-gradient(135deg, #004d20 0%, #007a32 40%, #00A651 70%, #005c26 100%);
    border-radius: 14px; padding: 22px 32px;
    display: flex; align-items: center; gap: 24px;
    margin-bottom: 36px; position: relative; overflow: hidden;
    box-shadow: 0 8px 50px rgba(0,166,81,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
    border: 1px solid rgba(0,166,81,0.3);
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .leader-banner::before {
    content: '';
    position: absolute; top: -40%; right: -5%;
    width: 280px; height: 280px;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
  }

  .leader-banner::after {
    content: '';
    position: absolute; bottom: -60%; left: 10%;
    width: 200px; height: 200px;
    background: rgba(255,215,0,0.04);
    border-radius: 50%;
  }

  .leader-banner:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 60px rgba(0,166,81,0.5);
  }

  .leader-crown {
    font-size: 44px;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 12px rgba(255,215,0,0.6));
  }

  @keyframes float {
    0%,100%{ transform: translateY(0) rotate(-3deg); }
    50%    { transform: translateY(-10px) rotate(3deg); }
  }

  .leader-info { flex: 1; }
  .leader-label {
    font-size: 10px; letter-spacing: 3px;
    text-transform: uppercase; opacity: 0.75; margin-bottom: 4px;
  }
  .leader-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 34px; letter-spacing: 2px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }

  .leader-score-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 68px; line-height: 1;
    color: var(--gold-light);
    text-shadow: 0 0 40px rgba(255,215,0,0.7), 0 0 80px rgba(255,215,0,0.3);
    animation: score-glow 2s ease-in-out infinite alternate;
  }

  @keyframes score-glow {
    0%   { text-shadow: 0 0 30px rgba(255,215,0,0.5); }
    100% { text-shadow: 0 0 60px rgba(255,215,0,0.9), 0 0 100px rgba(255,215,0,0.4); }
  }

  /* ===== CARDS GRID ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 20px; margin-bottom: 48px;
  }

  .card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 16px; padding: 26px;
    position: relative; overflow: hidden;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: default;
  }

  .card::before {
    content: ''; position: absolute; inset: 0; border-radius: 16px;
    background: radial-gradient(circle at 50% 0%, rgba(0,166,81,0.06) 0%, transparent 60%);
    opacity: 0; transition: opacity 0.4s;
  }

  .card::after {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    border-radius: 16px 16px 0 0;
    background: linear-gradient(90deg, var(--green-dark), var(--green), var(--green-light));
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.5s ease;
  }

  .card:hover {
    transform: translateY(-10px) scale(1.015);
    border-color: rgba(0,166,81,0.25);
    box-shadow: 0 24px 60px rgba(0,166,81,0.18), 0 0 0 1px rgba(0,166,81,0.1);
  }
  .card:hover::before { opacity: 1; }
  .card:hover::after  { transform: scaleX(1); }

  /* Gold card */
  .card.rank-1 {
    background: linear-gradient(145deg, #13110a, #1a160a, #10131f);
    border-color: rgba(255,215,0,0.2);
    box-shadow: 0 4px 30px rgba(255,215,0,0.08);
  }
  .card.rank-1::after { background: linear-gradient(90deg, #9a7200, var(--gold), var(--gold-light)); }
  .card.rank-1:hover {
    box-shadow: 0 24px 70px rgba(255,215,0,0.2), 0 0 0 1px rgba(255,215,0,0.2);
    border-color: rgba(255,215,0,0.4);
  }

  /* Silver card */
  .card.rank-2 {
    border-color: rgba(192,192,192,0.15);
  }
  .card.rank-2::after { background: linear-gradient(90deg, #666, var(--silver), #e8e8e8); }

  /* Bronze card */
  .card.rank-3 {
    border-color: rgba(205,127,50,0.2);
  }
  .card.rank-3::after { background: linear-gradient(90deg, #7a4500, var(--bronze), #e8a050); }

  .card-header {
    display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 18px;
  }

  .card-rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 12px; letter-spacing: 1.5px;
    padding: 4px 12px; border-radius: 20px;
    background: rgba(255,255,255,0.05); color: var(--gray);
  }

  .card.rank-1 .card-rank {
    background: rgba(255,215,0,0.12); color: var(--gold-light);
    box-shadow: 0 0 12px rgba(255,215,0,0.2);
  }
  .card.rank-2 .card-rank {
    background: rgba(192,192,192,0.12); color: var(--silver);
  }
  .card.rank-3 .card-rank {
    background: rgba(205,127,50,0.12); color: var(--bronze);
  }

  .card-medal { font-size: 24px; }

  .dept-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px; letter-spacing: 2px;
    margin-bottom: 4px; color: var(--white);
    transition: color 0.3s; line-height: 1.1;
  }

  .card:hover .dept-name { color: var(--green-light); }
  .card.rank-1 .dept-name { color: var(--gold-light); }
  .card.rank-1:hover .dept-name { color: #ffe55a; }

  .dept-slogan {
    font-size: 10px; color: var(--gray);
    letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 22px;
  }

  /* SCORE — sem botões */
  .score-area {
    display: flex; align-items: flex-end;
    gap: 12px; margin-bottom: 18px;
  }

  .score-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 72px; line-height: 1;
    color: var(--white);
    text-shadow: 0 0 20px rgba(255,255,255,0.08);
    min-width: 100px;
  }

  .card.rank-1 .score-display {
    color: var(--gold-light);
    text-shadow: 0 0 40px rgba(255,215,0,0.5);
    animation: score-glow 2.5s ease-in-out infinite alternate;
  }

  .card.rank-2 .score-display { color: var(--silver); }
  .card.rank-3 .score-display { color: var(--bronze); }

  .score-unit {
    font-size: 13px; color: var(--gray); margin-bottom: 14px;
    letter-spacing: 1px; text-transform: uppercase;
  }

  /* PROGRESS BAR */
  .progress-wrap { margin-top: 4px; }

  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 9px; color: var(--gray);
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 7px;
  }

  .progress-bar {
    height: 5px; background: rgba(255,255,255,0.05);
    border-radius: 5px; overflow: hidden;
  }

  .progress-fill {
    height: 100%; border-radius: 5px;
    background: linear-gradient(90deg, var(--green-dark), var(--green), var(--green-light));
    position: relative; transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .progress-fill::after {
    content: ''; position: absolute;
    top: 0; right: 0; width: 8px; height: 100%;
    background: rgba(255,255,255,0.8); border-radius: 50%;
    filter: blur(2px);
    animation: glow-move 2s ease-in-out infinite;
  }

  @keyframes glow-move { 0%,100%{opacity:0.5} 50%{opacity:1} }

  .card.rank-1 .progress-fill {
    background: linear-gradient(90deg, #7a5000, var(--gold), var(--gold-light));
  }
  .card.rank-2 .progress-fill {
    background: linear-gradient(90deg, #555, var(--silver));
  }
  .card.rank-3 .progress-fill {
    background: linear-gradient(90deg, #6b3800, var(--bronze), #e8a050);
  }

  /* ===== RANKING TABLE ===== */
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px; letter-spacing: 5px; color: var(--green);
    margin-bottom: 18px;
    display: flex; align-items: center; gap: 12px;
    text-shadow: 0 0 20px rgba(0,166,81,0.3);
  }

  .section-title::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, rgba(0,166,81,0.5), transparent);
  }

  .table-wrap {
    background: var(--card2);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }

  .table-head {
    display: grid;
    grid-template-columns: 64px 1fr 110px 120px 64px;
    padding: 14px 28px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 9px; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--gray);
  }

  .table-row {
    display: grid;
    grid-template-columns: 64px 1fr 110px 120px 64px;
    padding: 17px 28px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    align-items: center;
    transition: all 0.25s ease;
    cursor: default;
  }

  .table-row:last-child { border-bottom: none; }

  .table-row:hover {
    background: rgba(0,166,81,0.05);
    padding-left: 34px;
  }

  .table-row.row-gold   { background: rgba(255,215,0,0.03); }
  .table-row.row-silver { background: rgba(192,192,192,0.02); }
  .table-row.row-bronze { background: rgba(205,127,50,0.025); }

  .table-row.row-gold:hover   { background: rgba(255,215,0,0.06); }
  .table-row.row-silver:hover { background: rgba(192,192,192,0.05); }

  .t-pos {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px; color: var(--gray);
  }
  .t-pos.gold   { color: var(--gold-light); text-shadow: 0 0 12px rgba(255,215,0,0.4); }
  .t-pos.silver { color: var(--silver); }
  .t-pos.bronze { color: var(--bronze); }

  .t-name {
    font-weight: 700; font-size: 14px;
    display: flex; align-items: center; gap: 8px;
  }

  .t-pts {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px; color: var(--white);
    text-align: center;
  }
  .table-row.row-gold   .t-pts { color: var(--gold-light); }
  .table-row.row-silver .t-pts { color: var(--silver); }
  .table-row.row-bronze .t-pts { color: var(--bronze); }

  .t-bar-wrap {
    height: 6px; background: rgba(255,255,255,0.05);
    border-radius: 6px; overflow: hidden;
  }

  .t-bar {
    height: 100%; border-radius: 6px;
    background: linear-gradient(90deg, var(--green-dark), var(--green));
    transition: width 0.8s ease;
  }

  .table-row.row-gold   .t-bar { background: linear-gradient(90deg, #8a6000, var(--gold-light)); }
  .table-row.row-silver .t-bar { background: linear-gradient(90deg, #666, var(--silver)); }
  .table-row.row-bronze .t-bar { background: linear-gradient(90deg, #7a4500, var(--bronze)); }

  .t-trend { text-align: right; font-size: 18px; }

  /* ===== CONFETTI ===== */
  .confetti-piece {
    position: fixed; top: -10px; pointer-events: none;
    z-index: 999; border-radius: 2px;
    animation: confetti-fall linear forwards;
  }

  @keyframes confetti-fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* ===== FOOTER ===== */
  .footer {
    text-align: center; padding: 28px;
    color: var(--gray); font-size: 10px;
    letter-spacing: 3px; text-transform: uppercase;
    border-top: 1px solid rgba(255,255,255,0.04);
    margin-top: 48px;
  }

  .pulse-ring {
    display: inline-block; width: 8px; height: 8px;
    background: var(--green); border-radius: 50%;
    margin-right: 8px;
    animation: pulse-ring 2s ease infinite;
  }

  @keyframes pulse-ring {
    0%   { box-shadow: 0 0 0 0 rgba(0,166,81,0.6); }
    70%  { box-shadow: 0 0 0 10px rgba(0,166,81,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,166,81,0); }
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--black); }
  ::-webkit-scrollbar-thumb { background: var(--green-dark); border-radius: 3px; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 640px) {
    .table-head, .table-row {
      grid-template-columns: 48px 1fr 80px 0 48px;
    }
    .t-bar-wrap { display: none; }
    .leader-score-big { font-size: 48px; }
  }
</style>
</head>
<body>

<!-- Background layers -->
<canvas id="bg-canvas"></canvas>
<div class="bg-grid"></div>
<div class="bg-spotlight s1"></div>
<div class="bg-spotlight s2"></div>
<div class="bg-spotlight s3"></div>
<div class="hexagons" id="hexagons"></div>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="live-badge"><div class="live-dot"></div> AO VIVO</div>
    <div class="header-title">COPA 2026</div>
    <div class="header-sub">1ª Dinâmica</div>
    <div class="header-desc">Placar de Desempenho por Equipe</div>
    <div class="trophy-line">🏆</div>
  </div>

  <!-- LEADER BANNER -->
  <div class="leader-banner" id="leaderBanner">
    <div class="leader-crown">👑</div>
    <div class="leader-info">
      <div class="leader-label">Líder Atual</div>
      <div class="leader-name" id="leaderName">—</div>
    </div>
    <div class="leader-score-big" id="leaderScore">—</div>
  </div>

  <!-- CARDS -->
  <div class="grid" id="cardsGrid"></div>

  <!-- RANKING TABLE -->
  <div class="section-title">🏅 Classificação Geral</div>
  <div class="table-wrap">
    <div class="table-head">
      <span>Pos</span>
      <span>Equipe</span>
      <span style="text-align:center">Pontos</span>
      <span>Desempenho</span>
      <span style="text-align:right">Medal</span>
    </div>
    <div id="rankingTable"></div>
  </div>

</div>

<div class="footer">
  <span class="pulse-ring"></span>
  Placar em Tempo Real · FIFA World Cup 2026 Style · 1ª Dinâmica
</div>

<script>
// ===== DADOS REAIS — 1ª DINÂMICA (TOP 6, maior para menor) =====
const teams = [
  { id: 1, name: "Campinas",              slogan: "Campeões da 1ª Dinâmica",     score: 120 },
  { id: 2, name: "Comercial RJ",          slogan: "Força no Campo de Vendas",    score: 114 },
  { id: 3, name: "Adm. e Copa SP",        slogan: "Eficiência em Campo",         score: 114 },
  { id: 4, name: "Ribeirão Preto",        slogan: "Precisão e Determinação",     score: 112 },
  { id: 5, name: "Belo Horizonte",        slogan: "Estratégia e Resultado",      score: 110 },
  { id: 6, name: "TI Rio de Janeiro",     slogan: "Inovação em Campo",           score: 105 },
];

// Ordena por pontuação (já estão ordenados, mas garante)
const sorted = [...teams].sort((a, b) => b.score - a.score);
const maxScore = sorted[0].score;

function getMedalInfo(idx) {
  // Lida com empate: mesma pontuação = mesmo badge
  const score = sorted[idx].score;
  const rank1Score = sorted[0].score;
  const rank2Score = sorted[1].score;
  const rank3Score = sorted.find((t, i) => {
    // Pega o 3º score único após o empate do 2º
    const prevScores = sorted.slice(0, i).map(x => x.score);
    return !prevScores.includes(t.score) && t.score < rank2Score;
  })?.score;

  if (score === rank1Score)  return { label: "🥇 OURO",   badge: "🥇", rankClass: "rank-1", posClass: "gold",   rowClass: "row-gold"   };
  if (score === rank2Score)  return { label: "🥈 PRATA",  badge: "🥈", rankClass: "rank-2", posClass: "silver", rowClass: "row-silver" };
  if (score === rank3Score)  return { label: "🥉 BRONZE", badge: "🥉", rankClass: "rank-3", posClass: "bronze", rowClass: "row-bronze" };
  return { label: `#${idx + 1} LUGAR`, badge: "🎖️", rankClass: "", posClass: "", rowClass: "" };
}

function renderAll() {
  // Leader banner
  document.getElementById('leaderName').textContent  = sorted[0].name;
  document.getElementById('leaderScore').textContent = sorted[0].score;

  // Cards — na ordem do sorted (maior → menor)
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';

  sorted.forEach((team, idx) => {
    const m   = getMedalInfo(idx);
    const pct = Math.round((team.score / maxScore) * 100);

    const card = document.createElement('div');
    card.className = `card ${m.rankClass}`;
    card.innerHTML = `
      <div class="card-header">
        <span class="card-rank">${m.label}</span>
        <span class="card-medal">${m.badge}</span>
      </div>
      <div class="dept-name">${team.name}</div>
      <div class="dept-slogan">${team.slogan}</div>
      <div class="score-area">
        <div class="score-display">${team.score}</div>
        <div class="score-unit">pts</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-label">
          <span>Desempenho</span>
          <span>${pct}%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${pct}%"></div>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  // Ranking table
  const table = document.getElementById('rankingTable');
  table.innerHTML = '';

  sorted.forEach((team, idx) => {
    const m   = getMedalInfo(idx);
    const pct = Math.round((team.score / maxScore) * 100);
    const row = document.createElement('div');
    row.className = `table-row ${m.rowClass}`;
    row.innerHTML = `
      <div class="t-pos ${m.posClass}">${idx + 1}</div>
      <div class="t-name">${m.badge} ${team.name}</div>
      <div class="t-pts">${team.score}</div>
      <div class="t-bar-wrap"><div class="t-bar" style="width:${pct}%"></div></div>
      <div class="t-trend">${m.badge}</div>
    `;
    table.appendChild(row);
  });
}

// Hexagonos decorativos
(function buildHex() {
  const container = document.getElementById('hexagons');
  const count = 24;
  for (let i = 0; i < count; i++) {
    const h = document.createElement('div');
    h.className = 'hex';
    h.style.left  = (Math.random() * 100) + '%';
    h.style.top   = (Math.random() * 100) + '%';
    const s = 40 + Math.random() * 60;
    h.style.width  = s + 'px';
    h.style.height = (s * 0.866) + 'px';
    h.style.setProperty('--dur',   (3 + Math.random() * 6) + 's');
    h.style.setProperty('--delay', (-Math.random() * 6)    + 's');
    container.appendChild(h);
  }
})();

// Canvas: partículas + arcos de luz estilo estádio
(function () {
  const canvas = document.getElementById('bg-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  // Partículas (estrelas)
  const particles = [];
  function Particle() {
    this.reset = function() {
      this.x     = Math.random() * W;
      this.y     = Math.random() * H;
      this.r     = Math.random() * 1.4 + 0.2;
      this.vx    = (Math.random() - 0.5) * 0.25;
      this.vy    = (Math.random() - 0.5) * 0.25;
      this.alpha = Math.random() * 0.35 + 0.03;
      this.color = ['0,166,81','212,160,23','255,255,255'][Math.floor(Math.random()*3)];
    };
    this.reset();
  }

  for (let i = 0; i < 100; i++) {
    const p = new Particle();
    particles.push(p);
  }

  // Arcos de luz (beams estilo holofotes)
  const beams = Array.from({ length: 4 }, (_, i) => ({
    x: (i + 0.5) * (1 / 4),
    angle: -Math.PI / 2 + (Math.random() - 0.5) * 0.4,
    speed: (Math.random() - 0.5) * 0.003,
    alpha: 0.025 + Math.random() * 0.03,
    width: 0.04 + Math.random() * 0.03,
  }));

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Beams
    beams.forEach(b => {
      b.angle += b.speed;
      const startX = b.x * W;
      const endX   = startX + Math.tan(b.angle) * H * 1.5;
      const grad   = ctx.createLinearGradient(startX, H, endX, -H * 0.5);
      grad.addColorStop(0,   `rgba(0,166,81,${b.alpha})`);
      grad.addColorStop(0.5, `rgba(212,160,23,${b.alpha * 0.6})`);
      grad.addColorStop(1,   'rgba(0,0,0,0)');
      const hw = b.width * W;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(startX - hw, H);
      ctx.lineTo(startX + hw, H);
      ctx.lineTo(endX + hw, -H * 0.5);
      ctx.lineTo(endX - hw, -H * 0.5);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.globalAlpha = 1;
      ctx.fill();
      ctx.restore();
    });

    // Partículas
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
      ctx.fill();
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); });
  resize(); draw();
})();

// ===== INIT =====
renderAll();
</script>
